name: Verify and deploy

# PR: unit tests + compose smoke.
# Push to main / workflow_dispatch: authenticate to AWS (OIDC) → build SHA images →
# push ECR → deploy ECS Fargate (devops-g5-iac) in eu-west-1.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "20"
  AWS_REGION: eu-west-1
  # Set after terraform apply (output github_actions_role_arn), or override via repo variable.
  AWS_ROLE_ARN: ${{ vars.AWS_GHA_DEPLOY_ROLE_ARN || 'arn:aws:iam::240462142849:role/devops-g5-iac-gha-deploy' }}
  ECS_CLUSTER: devops-g5-iac-cluster
  NAME_PREFIX: devops-g5-iac

jobs:
  verify:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: service-a
            path: ./services/service-a
          - service: service-b
            path: ./services/service-b
          - service: service-c
            path: ./services/service-c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: npm test

      - name: Build application
        working-directory: ${{ matrix.path }}
        run: npm run build --if-present

  verify-compose:
    name: Local Compose smoke (nginx gateway)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config

      - name: Build and start Compose stack
        run: docker compose up -d --build --wait

      - name: Show running services
        run: docker compose ps

      - name: Check local gateway health
        run: curl --fail --silent --show-error http://localhost:8080/service-a/health | python3 -m json.tool

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Build and deploy to ECS (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [verify, verify-compose]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-a
            key: a
            port: "3001"
            container: service-a
          - service: service-b
            key: b
            port: "3002"
            container: service-b
          - service: service-c
            key: c
            port: "3003"
            container: service-c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GHA_DEPLOY_ROLE_ARN || 'arn:aws:iam::240462142849:role/devops-g5-iac-gha-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: meta
        run: |
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Using immutable tag ${SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./services/${{ matrix.service }}/package-lock.json

      - name: Install, test, and build service
        working-directory: ./services/${{ matrix.service }}
        run: |
          npm ci
          npm test
          npm run build --if-present

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ env.NAME_PREFIX }}-${{ matrix.service }}
          TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          IMAGE_URI="${REGISTRY}/${REPO}:${TAG}"
          docker build --platform linux/amd64 \
            -f "services/${{ matrix.service }}/Dockerfile" \
            --build-arg SERVICE_VERSION="${TAG}" \
            -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Deploy to ECS Fargate
        env:
          CLUSTER: ${{ env.ECS_CLUSTER }}
          SERVICE: ${{ env.NAME_PREFIX }}-svc-service-${{ matrix.key }}
          CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          TASK_DEF_ARN=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          if [ "$TASK_DEF_ARN" = "None" ] || [ -z "$TASK_DEF_ARN" ]; then
            echo "ECS service ${SERVICE} not found yet — image pushed; apply Terraform to create/scale services."
            exit 0
          fi
          aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' > task-def.json
          python3 - <<'PY'
          import json, os
          with open("task-def.json") as f:
              td = json.load(f)
          image = os.environ["IMAGE_URI"]
          container = os.environ["CONTAINER"]
          for c in td["containerDefinitions"]:
              if c["name"] == container:
                  c["image"] = image
                  for e in c.get("environment") or []:
                      if e.get("name") == "SERVICE_VERSION":
                          e["value"] = image.rsplit(":", 1)[-1]
          keep = [
              "family", "taskRoleArn", "executionRoleArn", "networkMode",
              "containerDefinitions", "volumes", "placementConstraints",
              "requiresCompatibilities", "cpu", "memory", "runtimePlatform",
          ]
          out = {k: td[k] for k in keep if k in td}
          with open("task-def-new.json", "w") as f:
              json.dump(out, f)
          PY
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_ARN" --force-new-deployment >/dev/null
          echo "Deployed ${SERVICE} → ${NEW_ARN}"
