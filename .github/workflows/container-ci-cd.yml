name: Verify

# PR / main gate only. Does NOT publish images or deploy to AWS.
# Deploy path: merge to main → CodeConnections → CodePipeline → CodeBuild
#   (buildspecs/service-*.yml) → ECR → ECS via imagedefinitions.json.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  verify-service-a:
    name: Unit tests (service-a)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added), 'services/service-a/') ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added), 'shared/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./services/service-a/package-lock.json
      - run: npm ci
        working-directory: ./services/service-a
      - run: npm test
        working-directory: ./services/service-a
      - run: npm run build --if-present
        working-directory: ./services/service-a

  verify-service-b:
    name: Unit tests (service-b)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added), 'services/service-b/') ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added), 'shared/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./services/service-b/package-lock.json
      - run: npm ci
        working-directory: ./services/service-b
      - run: npm test
        working-directory: ./services/service-b
      - run: npm run build --if-present
        working-directory: ./services/service-b

  verify-service-c:
    name: Unit tests (service-c)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added), 'services/service-c/') ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added), 'shared/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./services/service-c/package-lock.json
      - run: npm ci
        working-directory: ./services/service-c
      - run: npm test
        working-directory: ./services/service-c
      - run: npm run build --if-present
        working-directory: ./services/service-c

  verify-compose:
    name: Local Compose smoke (nginx gateway)
    runs-on: ubuntu-latest
    needs: [verify-service-a, verify-service-b, verify-service-c]
    if: always() && !contains(needs.*.result, 'failure')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config

      - name: Build and start Compose stack
        run: docker compose up -d --build --wait

      - name: Show running services
        run: docker compose ps

      - name: Check local gateway health
        run: curl --fail --silent --show-error http://localhost:8080/service-a/health | python3 -m json.tool

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
